# This workflow is used to update the platform SDK dependency when new version of the SDK is published to the npm registry.
# It creates a pull request with the updated dependencies for the example apps.
name: SDK Package Update Action

on:
  workflow_dispatch:

env:
  PACKAGE_NAME: "@microblink/platform-sdk"
  PACKAGE_VERSION: ""

jobs:
  update-and-create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      # v1 apps stay on the 1.x line: `latest` on npm is now 2.x.
      - name: Update v1 example apps to the latest 1.x version of the SDK
        run: |
          for app in v1/react v1/vanilla v1/vanilla-with-d2d; do
            echo "Updating $app..."
            (cd $app && npm ci && npm install ${{ env.PACKAGE_NAME }}@^1 && npm run build)
          done

      - name: Update v2 example apps to the latest version of the SDK
        run: |
          for app in v2/vanilla v2/react v2/custom-ui; do
            echo "Updating $app..."
            (cd $app && npm ci && npm install ${{ env.PACKAGE_NAME }}@latest && npm run build)
          done

      - name: Get the latest version
        run: |
          echo "PACKAGE_VERSION=$(npm show ${{ env.PACKAGE_NAME }} version)" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update ${{ env.PACKAGE_NAME }} to latest version"
          title: "Update ${{ env.PACKAGE_NAME }} to ${{ env.PACKAGE_VERSION }}"
          body: |
            This PR updates the ${{ env.PACKAGE_NAME }} dependency to version ${{ env.PACKAGE_VERSION }} for the example apps.
            The changes are automatically generated by the SDK Package Update Action.
            Please review the changes and merge the PR if everything looks good.
          branch: "chore/update-${{ env.PACKAGE_NAME }}"
          delete-branch: true
